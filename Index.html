<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer Embed Test Page</title>
    
    <!-- GENERIC INLINE SVG FAVICON TO PREVENT LIVE SERVER 404 ERRORS -->

    <style>

            max-width: 640px;

        h1 {
            font-size: 20px;
            color: #1a1a1a;
            margin-top: 0;

            text-align: center;
        }

        p {
            font-size: 14px;
            color: #666666;
            margin-bottom: 24px;
            text-align: center;
        }

        .embed-wrapper {
            background-color: #000000; /* Dark background helps 3D models pop */
            border-radius: 12px;
            overflow: hidden;
